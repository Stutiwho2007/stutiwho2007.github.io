  <script>
    /* MOBILE NAV */
    const menuButton = document.getElementById('menuButton');
    const navLinks = document.getElementById('navLinks');

    menuButton.addEventListener('click', () => {
      const open = navLinks.classList.toggle('open');
      menuButton.setAttribute('aria-expanded', open ? 'true' : 'false');
      menuButton.textContent = open ? '×' : '☰';
      document.body.classList.toggle('menu-open', open);
    });

    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('open');
        menuButton.setAttribute('aria-expanded', 'false');
        menuButton.textContent = '☰';
        document.body.classList.remove('menu-open');
      });
    });

    /* MINHO CAROUSEL */
    const track = document.getElementById('manifestoTrack');
    const carousel = document.getElementById('manifestoCarousel');
    const next = document.getElementById('manifestoNext');
    const prev = document.getElementById('manifestoPrev');
    const current = document.getElementById('carouselCurrent');
    const total = track.children.length;
    let index = 0;

    function updateCarousel() {
      track.style.transform = `translate3d(-${index * 100}%, 0, 0)`;
      current.textContent = String(index + 1).padStart(2, '0');
      prev.disabled = index === 0;
      next.disabled = index === total - 1;
    }

    function goTo(i) {
      index = Math.max(0, Math.min(total - 1, i));
      updateCarousel();
    }

    next.addEventListener('click', () => goTo(index + 1));
    prev.addEventListener('click', () => goTo(index - 1));

    carousel.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') goTo(index + 1);
      if (e.key === 'ArrowLeft') goTo(index - 1);
    });

    let startX = 0;
    carousel.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; }, {passive:true});
    carousel.addEventListener('touchend', e => {
      const distance = startX - e.changedTouches[0].screenX;
      if (Math.abs(distance) > 50) distance > 0 ? goTo(index + 1) : goTo(index - 1);
    }, {passive:true});

    updateCarousel();

    /* FAQ */
    document.querySelectorAll('.faq-question').forEach(button => {
      button.addEventListener('click', () => {
        const item = button.closest('.faq-item');
        const answer = item.querySelector('.faq-answer');
        const isOpen = item.classList.contains('open');

        document.querySelectorAll('.faq-item.open').forEach(other => {
          other.classList.remove('open');
          other.querySelector('.faq-question').setAttribute('aria-expanded', 'false');
          other.querySelector('.faq-answer').style.maxHeight = null;
        });

        if (!isOpen) {
          item.classList.add('open');
          button.setAttribute('aria-expanded', 'true');
          answer.style.maxHeight = answer.scrollHeight + 'px';
        }
      });
    });

    /* PROJECT FORM -> MAILTO */
    document.getElementById('projectForm').addEventListener('submit', e => {
      e.preventDefault();
      const form = new FormData(e.currentTarget);
      const name = form.get('name');
      const email = form.get('email');
      const type = form.get('type');
      const message = form.get('message');

      const subject = encodeURIComponent(`MINHO Project Inquiry — ${type}`);
      const body = encodeURIComponent(
        `Name: ${name}\nEmail: ${email}\nProject type: ${type}\n\nProject details:\n${message}`
      );

      window.location.href = `mailto:foundminhostudio@gmail.com?subject=${subject}&body=${body}`;
    });

    /* SCROLL REVEAL */
    const revealItems = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, {threshold:0.12});

    revealItems.forEach(item => observer.observe(item));
  </script>
